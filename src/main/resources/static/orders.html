<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin: Orders</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="index.html">🍕 FoodDelivery</a>
        <a class="btn btn-outline-light btn-sm" href="menu.html">Order Food</a>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0">Orders</h4>
        <div class="d-flex gap-2">
            <select id="statusFilter" class="form-select form-select-sm">
                <option value="">All statuses</option>
                <option>PENDING</option>
                <option>CONFIRMED</option>
                <option>DELIVERED</option>
            </select>
            <button id="refreshBtn" class="btn btn-sm btn-outline-secondary">Refresh</button>
        </div>
    </div>

    <div id="alertBox"></div>

    <div class="table-responsive">
        <table class="table table-hover align-middle bg-white shadow-sm">
            <thead class="table-light">
            <tr>
                <th>#</th><th>Customer</th><th>Address</th><th>Items</th>
                <th>Total</th><th>Status</th><th>Placed</th><th>Action</th>
            </tr>
            </thead>
            <tbody id="ordersBody">
            <tr><td colspan="8" class="text-center text-muted">Loading...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script>
    let orders = [];
    const NEXT_STATUS = { PENDING: 'CONFIRMED', CONFIRMED: 'DELIVERED' };

    async function loadOrders() {
        try {
            orders = await apiFetch('/orders');
            renderOrders();
        } catch (e) {
            showAlert('alertBox', 'danger', 'Could not load orders: ' + escapeHtml(e.message));
        }
    }

    function renderOrders() {
        const filter = document.getElementById('statusFilter').value;
        const visible = filter ? orders.filter(o => o.status === filter) : orders;
        const body = document.getElementById('ordersBody');

        if (visible.length === 0) {
            body.innerHTML = '<tr><td colspan="8" class="text-center text-muted">No orders found.</td></tr>';
            return;
        }

        body.innerHTML = visible.map(order => {
            const next = NEXT_STATUS[order.status];
            const itemsText = order.items
                .map(i => `${escapeHtml(i.menuItemName)} × ${i.quantity}`)
                .join('<br>');
            const action = next
                ? `<button class="btn btn-sm btn-outline-primary" data-id="${order.id}" data-next="${next}">
                       Mark ${next}
                   </button>`
                : '<span class="text-muted">—</span>';

            return `<tr>
                <td>${order.id}</td>
                <td>${escapeHtml(order.customerName)}</td>
                <td>${escapeHtml(order.deliveryAddress)}</td>
                <td class="small">${itemsText}</td>
                <td>${formatINR(order.totalAmount)}</td>
                <td>${statusBadge(order.status)}</td>
                <td class="small">${new Date(order.createdAt).toLocaleString()}</td>
                <td>${action}</td>
            </tr>`;
        }).join('');
    }

    document.getElementById('ordersBody').addEventListener('click', async event => {
        const btn = event.target.closest('button[data-id]');
        if (!btn) return;
        btn.disabled = true;
        try {
            await apiFetch(`/orders/${btn.dataset.id}/status?status=${btn.dataset.next}`, { method: 'PATCH' });
            await loadOrders();
        } catch (e) {
            showAlert('alertBox', 'danger', escapeHtml(e.message));
            btn.disabled = false;
        }
    });

    document.getElementById('statusFilter').addEventListener('change', renderOrders);
    document.getElementById('refreshBtn').addEventListener('click', loadOrders);

    loadOrders();
</script>
</body>
</html>
