<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Menu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="index.html">🍕 FoodDelivery</a>
        <a class="btn btn-outline-light btn-sm" href="orders.html">Admin: Orders</a>
    </div>
</nav>

<div class="container">
    <div id="alertBox"></div>

    <div class="row g-4">
        <!-- Menu -->
        <div class="col-lg-8">
            <h4 class="mb-3">Menu</h4>
            <div id="menuList" class="row g-3">
                <div class="text-muted">Loading menu...</div>
            </div>
        </div>

        <!-- Cart + checkout -->
        <div class="col-lg-4">
            <div class="card shadow-sm sticky-top" style="top: 1rem;">
                <div class="card-body">
                    <h5 class="card-title">Your Order</h5>
                    <div id="cartLines" class="mb-2 text-muted">Your cart is empty.</div>
                    <div class="d-flex justify-content-between fw-bold border-top pt-2 mb-3">
                        <span>Total</span><span id="cartTotal">₹0.00</span>
                    </div>

                    <form id="orderForm" novalidate>
                        <div class="mb-2">
                            <label class="form-label" for="customerName">Name</label>
                            <input id="customerName" class="form-control" maxlength="100">
                            <div class="invalid-feedback" id="err-customerName"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="deliveryAddress">Delivery address</label>
                            <textarea id="deliveryAddress" class="form-control" rows="2" maxlength="255"></textarea>
                            <div class="invalid-feedback" id="err-deliveryAddress"></div>
                        </div>
                        <button id="placeBtn" type="submit" class="btn btn-danger w-100">Place Order</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script>
    let menu = [];
    const cart = {};   // menuItemId -> quantity

    async function loadMenu() {
        try {
            menu = await apiFetch('/menu');
            renderMenu();
        } catch (e) {
            showAlert('alertBox', 'danger', 'Could not load the menu: ' + escapeHtml(e.message));
        }
    }

    function renderMenu() {
        const list = document.getElementById('menuList');
        if (menu.length === 0) {
            list.innerHTML = '<div class="text-muted">No items available right now.</div>';
            return;
        }
        list.innerHTML = menu.map(item => `
            <div class="col-md-6">
                <div class="card h-100 shadow-sm">
                    <div class="card-body d-flex flex-column">
                        <h6 class="card-title mb-1">${escapeHtml(item.name)}</h6>
                        <p class="card-text text-muted small flex-grow-1">${escapeHtml(item.description || '')}</p>
                        <div class="d-flex justify-content-between align-items-center">
                            <span class="fw-semibold">${formatINR(item.price)}</span>
                            <div class="btn-group btn-group-sm">
                                <button class="btn btn-outline-secondary" data-action="dec" data-id="${item.id}">−</button>
                                <span class="btn btn-light disabled" id="qty-${item.id}">${cart[item.id] || 0}</span>
                                <button class="btn btn-outline-secondary" data-action="inc" data-id="${item.id}">+</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>`).join('');
    }

    function renderCart() {
        const lines = document.getElementById('cartLines');
        let total = 0;
        const html = [];

        for (const item of menu) {
            const qty = cart[item.id] || 0;
            if (qty > 0) {
                const lineTotal = item.price * qty;
                total += lineTotal;
                html.push(`<div class="d-flex justify-content-between small">
                              <span>${escapeHtml(item.name)} × ${qty}</span>
                              <span>${formatINR(lineTotal)}</span>
                           </div>`);
            }
            const qtyEl = document.getElementById('qty-' + item.id);
            if (qtyEl) qtyEl.textContent = qty;
        }

        lines.innerHTML = html.length ? html.join('') : 'Your cart is empty.';
        document.getElementById('cartTotal').textContent = formatINR(total);
    }

    // One listener for all +/- buttons
    document.getElementById('menuList').addEventListener('click', event => {
        const btn = event.target.closest('button[data-action]');
        if (!btn) return;
        const id = Number(btn.dataset.id);
        const current = cart[id] || 0;
        cart[id] = btn.dataset.action === 'inc' ? current + 1 : Math.max(0, current - 1);
        renderCart();
    });

    function clearFieldErrors() {
        ['customerName', 'deliveryAddress'].forEach(field => {
            document.getElementById(field).classList.remove('is-invalid');
            document.getElementById('err-' + field).textContent = '';
        });
    }

    document.getElementById('orderForm').addEventListener('submit', async event => {
        event.preventDefault();
        clearFieldErrors();
        document.getElementById('alertBox').innerHTML = '';

        const items = Object.entries(cart)
            .filter(([, qty]) => qty > 0)
            .map(([id, qty]) => ({ menuItemId: Number(id), quantity: qty }));

        const payload = {
            customerName: document.getElementById('customerName').value,
            deliveryAddress: document.getElementById('deliveryAddress').value,
            items
        };

        const button = document.getElementById('placeBtn');
        button.disabled = true;

        try {
            const order = await apiFetch('/orders', { method: 'POST', body: JSON.stringify(payload) });
            showAlert('alertBox', 'success',
                `Order <strong>#${order.id}</strong> placed! Total: <strong>${formatINR(order.totalAmount)}</strong>.`);
            Object.keys(cart).forEach(k => delete cart[k]);
            document.getElementById('orderForm').reset();
            renderCart();
        } catch (e) {
            if (e.fieldErrors) {
                for (const [field, message] of Object.entries(e.fieldErrors)) {
                    const input = document.getElementById(field);
                    if (input) {
                        input.classList.add('is-invalid');
                        document.getElementById('err-' + field).textContent = message;
                    } else {
                        // e.g. "items" errors or "items[0].quantity"
                        showAlert('alertBox', 'danger', escapeHtml(message));
                    }
                }
            } else {
                showAlert('alertBox', 'danger', escapeHtml(e.message));
            }
        } finally {
            button.disabled = false;
        }
    });

    loadMenu();
</script>
</body>
</html>
